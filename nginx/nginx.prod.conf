events {}

http {
    upstream backend {
        least_conn;
        server backend:8080;
    }

    server {
        listen 80;
        server_name versus.p3tchtanathip.work;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/versus.p3tchtanathip.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/versus.p3tchtanathip.work/privkey.pem;

        # Forward /api/* to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # frontend container
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}